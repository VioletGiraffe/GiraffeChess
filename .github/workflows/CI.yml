name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-latest
            cxx: g++
            script: sh
          - os: windows-latest
            cxx: cl
            script: bat

    env:
      CXX: ${{ matrix.cxx }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: seanmiddleditch/gha-setup-ninja@master

    # Puts cl on PATH, so the scripts skip their own vcvarsall call: runners have a different VS edition
    - uses: ilammy/msvc-dev-cmd@v1
      if: runner.os == 'Windows'

    - name: Build
      run: scripts/build.${{ matrix.script }} release

    - name: Test
      run: scripts/run_tests.${{ matrix.script }} release full

    # ctest keeps the test's stdout in LastTest.log on a pass too
    - name: Performance summary
      shell: bash
      run: |
        perf=$(grep '^perf: ' build/release/Testing/Temporary/LastTest.log)
        echo "**${{ matrix.os }}**: $perf" >> "$GITHUB_STEP_SUMMARY"

